services:
  - type: web
    name: itsm-frontend
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 3000
      - key: VITE_API_URL
        sync: false
    healthCheckPath: /
    autoDeploy: true